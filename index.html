<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131210; --panel:#1B1916; --raise:#232019; --line:#332E27;
    --paper:#EFE9E0; --dim:#A39A8D; --faint:#6F675C;
    --brass:#D4A24C; --brass-dim:#8A6A2E; --warn:#D98B6A;
    --serif:'Crimson Pro',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.65;font-variant-numeric:lining-nums}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button,input,select,textarea{font-family:inherit;font-size:15px;font-weight:300;color:var(--paper)}
  button{cursor:pointer}
  input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
  textarea{resize:vertical;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass-dim)}
  select option{background:var(--panel)}
  label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}

  .btn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:14px;white-space:nowrap}
  .btn:hover{border-color:var(--faint);background:var(--raise)}
  .btn-go{background:var(--brass);border-color:var(--brass);color:#2A1E08;font-weight:500}
  .btn-go:hover{background:#E0B15E;border-color:#E0B15E}
  .btn-go[disabled]{opacity:.45;cursor:not-allowed}
  .btn-quiet{border-color:transparent;color:var(--dim);padding:6px 9px}
  .btn-quiet:hover{color:var(--paper);background:var(--raise);border-color:transparent}

  header{display:flex;align-items:center;gap:18px;height:54px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .wordmark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em}
  .mode{font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  header .sp{flex:1}

  .shell{display:grid;grid-template-columns:252px minmax(0,1fr);height:calc(100vh - 54px)}
  aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px 0}
  .rail-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;font-size:12.5px;color:var(--faint)}
  .proj{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:14px;color:var(--dim);cursor:pointer;border-left:2px solid transparent}
  .proj:hover{background:var(--raise);color:var(--paper)}
  .proj.on{background:var(--raise);color:var(--paper);border-left-color:var(--brass)}
  .proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .rail-gap{height:1px;background:var(--line);margin:16px 16px}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;color:var(--dim);cursor:pointer;border-left:2px solid transparent}
  .nav:hover{background:var(--raise);color:var(--paper)}
  .nav.on{background:var(--raise);color:var(--paper)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line);border:1px solid var(--faint)}
  .dot.done{border-color:transparent}
  .nav small{color:var(--faint);font-size:12px}

  main{overflow-y:auto;padding:30px 36px 80px}
  .col{max-width:760px}
  h1{font-family:var(--serif);font-size:30px;font-weight:600;margin:0 0 4px;line-height:1.15}
  h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .stack{display:grid;gap:14px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .phase-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
  .chip{width:10px;height:10px;border-radius:50%;margin-top:9px;flex:none}
  .out{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:0 10px 10px 0;padding:22px 24px;margin-top:18px}
  .out h1,.out h2{font-size:19px;margin:22px 0 6px}
  .out h3{font-size:16px;font-weight:500;margin:18px 0 4px;font-family:var(--sans)}
  .out>:first-child{margin-top:0}
  .out p,.out li{color:#DED7CC}
  .out ul,.out ol{padding-left:20px;margin:6px 0}
  .out li{margin:3px 0}
  .out code{font-family:ui-monospace,monospace;font-size:13px;background:var(--raise);padding:1px 5px;border-radius:4px}
  .out table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
  .out th,.out td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  .out th{background:var(--raise);font-weight:500}
  .out strong{font-weight:500;color:var(--paper)}
  .out hr{border:0;border-top:1px solid var(--line);margin:20px 0}
  .out a{color:var(--brass)}
  .out pre{background:var(--raise);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:10px 0}
  .out pre code{background:none;padding:0}
  .out blockquote{border-left:2px solid var(--line);margin:10px 0;padding:2px 0 2px 14px;color:var(--dim)}
  .hist{padding:14px 16px}
  .hist .row{font-size:13.5px;color:var(--dim)}
  .hist-preview{margin:8px 0 0;font-size:13.5px;color:var(--faint)}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .tag-on{color:var(--brass);border-color:var(--brass-dim)}
  .intake summary{cursor:pointer;font-family:var(--serif);font-size:19px;font-weight:600}
  .intake summary::marker{color:var(--brass)}
  .filled{border-color:var(--brass-dim);background:var(--raise)}
  .export-options{display:grid;gap:10px}
  .export-option{display:grid;gap:2px;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .export-option:hover{border-color:var(--brass-dim);background:var(--raise)}
  .export-option strong{font-weight:500;color:var(--paper)}
  .export-option span{font-size:13.5px;color:var(--dim)}
  .model-pick select{width:auto;padding:7px 10px;font-size:14px;background:var(--panel)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .meta{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--faint);margin-top:12px;flex-wrap:wrap}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:34px 24px;text-align:center;color:var(--dim)}
  .note{font-size:13.5px;color:var(--dim);background:var(--raise);border-radius:8px;padding:12px 14px}
  .err{font-size:13.5px;color:var(--warn);background:rgba(217,139,106,.08);border:1px solid rgba(217,139,106,.3);border-radius:8px;padding:12px 14px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-size:14px;color:var(--dim)}
  .tab.on{color:var(--paper);border-bottom-color:var(--brass)}
  .mono{font-family:ui-monospace,monospace;font-size:13.5px;line-height:1.65}

  .modal{position:fixed;inset:0;background:rgba(10,9,8,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
  .modal .card{width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
  .cursor{display:inline-block;width:7px;height:16px;background:var(--brass);vertical-align:-3px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr;height:auto}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    main{padding:22px 18px 60px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <span class="wordmark">Creative Agent</span>
  <span class="mode" id="mode">local</span>
  <span class="sp"></span>
  <button class="btn btn-quiet" id="export-btn">Export project</button>
  <button class="btn" id="settings-btn">Settings</button>
</header>

<div class="shell">
  <aside>
    <div class="rail-head"><span>Projects</span><button class="btn btn-quiet" id="new-btn">New</button></div>
    <div id="projects"></div>
    <div class="rail-gap"></div>
    <div id="nav"></div>
  </aside>
  <main><div class="col" id="view"></div></main>
</div>

<div id="modal-root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
